name: CLA

# This runs on pull_request_target so that the workflow, scripts/verify-cla.py, CLA.md and .github/cla-exempt.json all come from the BASE branch: a pull request cannot change how it is judged, however it edits those files.

# The pull request head is only ever read as data (git show of one record file, API listings of its commits and files). Never check it out and never run anything from it in this workflow.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify CLA
    runs-on: ubuntu-latest
    steps:
      # No ref: for pull_request_target this checks out the base branch. The default credentials stay configured because fetching the pull request head ref below needs them; no later step runs code from the pull request.
      - name: Check out the base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch the pull request head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/cla/pr-head"

      - name: Validate contributor acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: python3 scripts/verify-cla.py
