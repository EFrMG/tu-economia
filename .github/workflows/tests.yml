name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.3
      - uses: jdx/mise-action@v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run
