name: Refresh rates

# Rebuilds the Tasas data from the BCRA Régimen de Transparencia and commits the result straight to master as github-actions[bot]. See "Refreshing" in docs/transparency-rates.md.
#
# A push made with the default token does not start the Tests workflow, so this job runs `pnpm test` itself and commits only if it passes.
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.3
      - uses: jdx/mise-action@v4.3.0
      - run: pnpm install --frozen-lockfile

      - name: Require Python 3.11 or later
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Build the rates
        run: python3 -I scripts/build-transparency-rates.py

      - name: Verify
        run: |
          pnpm test
          pnpm exec wrangler deploy --dry-run

      - name: Commit and push
        run: |
          git add app/lib/transparency-rates.generated.json

          if git diff --cached --quiet; then
            echo "The rates are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh rates from the BCRA Régimen de Transparencia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
